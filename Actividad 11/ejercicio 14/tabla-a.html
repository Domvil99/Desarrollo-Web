<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>tabla-a</title>
    </head>
    <body>
        <header>

        </header>

        <main>
            <form>
                <fieldset>
                    <legend>Datos fiscales</legend>
                    
                    <select multiple name="oficio">
                        <option value="Automoción">Automoción</option>
                        <option value="Metal">Metal</option>
                        <option value="Informatica" selected>Informática</option>
                        <option value="Finanzas">Finanzas</option>
                    </select>
                    <br>
                    <input type="checkbox" name="autonomo" id="id_autonomo">
                    <label for="id_autonomo">Autónomo</label>
                    <input type="checkbox" name="cuentaAjena" checked id="id_cuentaAjena">
                    <label for="id_cuentaAjena">Por c. ajena</label>
                    <input type="checkbox" name ="noSabe" id="id_noSabe">
                    <label for="id_noSabe">No se sabe</label>
                    <br>
                    <label for="id_funcion">Describa su función:</label>
                    <br>
                    <textarea name="funcion_descrita" placeholder="Escriba aquí" id="id_funcion"></textarea>
                </fieldset>
            </form>
        </main>
        
        <footer>

        </footer>
        
    </body>
</html>
