<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>tabla-b</title>
</head>

<body>
    
    <main>
        <form>
            <fieldset>
                <legend>Datos personales</legend>

                <label for="id_nombre">Nombre:</label>
                <input type="text" id="id_nombre" name="nombre">
                <br>
                <label for="id_apellidos">Apellidos:</label>
                <input type="text" id="id_apellidos" name="apellidos">
                <br>
                <label for="id_dni">DNI:</label>
                <input type="text" id="id_dni" name="dni">
              
            </fieldset>         
        </form>
        <form>
            <fieldset>
                <legend>Datos académicos</legend>

                <p>Elija un ciclo:</p>
                <input type="radio" name="ciclo" id="id_dam" value="dam">
                <label for="id_dam">DAM</label>
                <br>
                <input type="radio" name="ciclo" id="id_daw" value="daw">
                <label for="id_daw">DAW</label>
                <br>
                <input type="radio" name="ciclo" id="id_asir" value="asir" checked>
                <label for="id_asir">ASIR</label>
            </fieldset>         
        </form>
    </main>
    
</body>
</html>
