<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="id_nombre">Nombre:</label>
        <input type="text" name="nombre" id="id_nombre">
        <br><br>
        <label for="id_correo">Correo electrónico:</label>
        <input type="email" name="correo" id="id_correo">
        <br><br>
        <label for="id_url">URL:</label>
        <input type="url" name="url" id="id_url">
        <br><br>
        <label for="id_fecha">Fecha:</label>
        <input type="date" name="fecha" id="id_fecha">
        <br><br>
        <label for="id_tiempo">Tiempo:</label>
        <input type="time" name="tiempo" id="id_tiempo">
        <br><br>
        <label for="id_fechaYhora">Fecha y hora:</label>
        <input type="datetime-local" name="fechaYhora" id="id_fechaYhora">
        <br><br>
        <label for="id_mes">Mes:</label>
        <input type="month" name="mes" id="id_mes">
        <br><br>
        <label for="id_semana">Semana:</label>
        <input type="week" name="semana" id="id_semana">
        <br><br>
        <label for="id_numero">Número (min -10, max 10):</label>
        <input type="number" name="numero" id="id_numero" min="-10" max="10" step="5">
        <br><br>
        <label for="id_telefono">Teléfono:</label>
        <input type="tel" name="telefno" id="id_telefono">
        <br><br>
        <label for="id_busqueda">Término de búsqueda:</label>
        <input type="search" name="busqueda" id="id_busqueda">
        <br><br>
        <label for="id_color">Color favorito:</label>
        <input type="color" name="color" id="id_color">
        <br><br>
        <input type="submit" value="Enviar" id="id_enviar">
        <label for="id_enviar"></label>
    </form>
</body>
</html>
