<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarea evaluativa práctica UF1842</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <section class="hero">
    <div class="container">

      <!-- LADO IZQUIERDO -->
      <div class="content">

        
        <div class="badge">
          <img src="img/cohete.svg" class="badge-icon" alt="cohete">
          <span>Inscripciones abiertas 2026</span>
        </div>

    
        <h1>
          Construye tu futuro 
          <span class="highlight">digital</span>
        </h1>

       
        <p>
          Domina HTML, CSS y herramientas modernas en una academia pensada 
          para formar profesionales reales. Aprende con proyectos prácticos 
          desde el primer día.
        </p>

        
        <form action="#" method="post">
          
          <div class="input-wrapper">
            
            <img src="img/mail.svg" class="mail-icon" alt="logo correo">


            <input type="email" placeholder="tu email">

            <button type="submit">
              Empieza hoy
              <img src="img/flecha.svg" class="arrow-icon" alt="flecha">
            </button>

          </div>

        </form>

        
        <div class="bottom-info">
          <img src="img/security.svg" class="small-icon" alt="security">
          <span>Únete a más de 5,000 estudiantes ya formados.</span>
        </div>

      </div>
      <!-- LADO derecho -->

      <div class="illustration">
        <img src="img/Astract_Illustration.svg" alt="Ilustración decorativa">
      </div>

    </div>
  </section>

</body>
</html>
